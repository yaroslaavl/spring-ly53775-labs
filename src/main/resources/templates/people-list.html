<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>People List</title>
</head>
<body>

<h1>People</h1>

<table border="1">
    <tr>
        <th>First Name</th>
        <th>Last Name</th>
    </tr>

    <tr th:each="p : ${people}">
        <td th:text="${p.firstName}"></td>
        <td th:text="${p.lastName}"></td>
    </tr>
</table>

<br>
<a href="/people/add">Add new person</a>

</body>
</html>
